name: Food Delivery CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check Python syntax
        run: |
          python -m py_compile app.py


      - name: Build Docker image
        run: |
          docker build -t food-delivery-app .


  docker:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Check Docker Hub username secret
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is EMPTY"
            exit 1
          else
            echo "DOCKERHUB_USERNAME is available"
          fi


      - name: Check Docker Hub token secret
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN is EMPTY"
            exit 1
          else
            echo "DOCKERHUB_TOKEN is available"
          fi


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-mlops:latest .


      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-mlops:latest